<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>رنگ کن! 🎨 | ریاضی سوم دبستان</title>
<style>
:root{--ink:#4A148C;--pink:#F06292;--yellow:#FFD54F;--cream:#FFF8E1;--ok:#2E7D32;--bad:#C62828;--wood:#A1662F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:radial-gradient(circle at 20% 10%,#fff 0,transparent 40%),linear-gradient(#FCE4EC,#FFF3E0 55%,#E1F5FE);display:flex;justify-content:center}
#app{width:100%;max-width:560px;height:100dvh;position:relative;display:flex;flex-direction:column;padding:8px 12px 32px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.pill{background:#fff;border-radius:22px;padding:5px 14px;font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(74,20,140,.18)}
.pill.lv{background:var(--ink);color:var(--yellow)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:#fff;font-size:20px;box-shadow:0 3px 0 rgba(74,20,140,.18);cursor:pointer}
.bar{height:12px;background:rgba(255,255,255,.8);border-radius:8px;margin:4px 2px 6px;overflow:hidden;border:2px solid #fff}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,#EF5350,#FFA726,#FFEE58,#66BB6A,#42A5F5,#AB47BC);transition:width .45s}
.q{flex:none;text-align:center;font-weight:900;font-size:clamp(17px,2.8dvh,22px);margin:2px 6px 6px;line-height:1.55;min-height:2.4em;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
.easel{flex:1 1 auto;min-height:0;background:#fff;border:10px solid var(--wood);border-radius:18px;box-shadow:0 8px 0 rgba(0,0,0,.18),inset 0 0 0 3px #d9a56a;display:flex;align-items:center;justify-content:center;padding:8px;position:relative;overflow:hidden}
.easel svg{max-height:100%;max-width:100%}
.mrow{display:flex;align-items:center;gap:8px;margin:8px 0 4px;min-height:74px}
#mas{width:68px;height:68px;flex:none}
.bubble{flex:1;background:#fff;border-radius:18px;padding:8px 12px;font-weight:800;font-size:15px;line-height:1.55;box-shadow:0 3px 0 rgba(74,20,140,.16);position:relative;min-height:54px;display:flex;align-items:center}
.bubble:before{content:"";position:absolute;right:-8px;top:22px;border:8px solid transparent;border-left-color:#fff;border-right:0}
.bubble.ok{color:var(--ok)}.bubble.bad{color:var(--bad)}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:4px 0}
.btn{border:0;border-radius:24px;font:900 17px Vazirmatn,Tahoma;padding:9px 26px;cursor:pointer;color:#fff;background:var(--pink);box-shadow:0 5px 0 #ad1457}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(74,20,140,.25)}
.btn.go{background:#43A047;box-shadow:0 5px 0 #1b5e20}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn[disabled]{opacity:.45;pointer-events:none}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;font-weight:900;vertical-align:middle}
.fr i{display:block;width:1.3em;height:.11em;background:currentColor;margin:.14em 0;border-radius:2px}
.big .fr{font-size:34px;background:#fff;border-radius:14px;padding:6px 14px;box-shadow:0 3px 0 rgba(74,20,140,.2);color:#C2185B}
.cell{cursor:pointer;transition:fill .15s}
.cell:hover{filter:brightness(.97)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:2px 0 6px}
.chip{background:#fff;border:3px solid #fff;border-radius:20px;padding:5px 12px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 3px 0 rgba(74,20,140,.2);display:flex;align-items:center;gap:6px}
.chip.sel{border-color:var(--ink);transform:translateY(-2px)}
.chip .dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.opt{width:76px;height:76px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff,#F8BBD0);box-shadow:0 5px 0 #ad1457,inset 0 0 0 4px #fff;cursor:pointer;color:var(--ink);font-size:24px;display:flex;align-items:center;justify-content:center}
.opt.off{opacity:.35;pointer-events:none}
.opt.glow{box-shadow:0 0 0 5px #fff,0 0 18px 8px #FFEB3B}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;width:100%;height:100%;grid-template-rows:repeat(3,minmax(0,1fr));align-content:stretch;justify-items:center}
.card{background:#fff8e1;border:4px solid #fff;border-radius:16px;box-shadow:0 4px 0 rgba(74,20,140,.25);padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;width:min(100%,150px);height:100%;min-height:0;overflow:hidden}
.card svg{flex:1 1 0;min-height:0;width:100%;height:100%;max-height:none}
.card.sel{border-color:var(--ink);transform:scale(1.05)}
.card.done{border-color:#43A047;background:#E8F5E9;pointer-events:none}
.card .lbl{flex:none;height:24px;font-size:17px;display:flex;align-items:center;color:var(--ok)}
.card .lbl .fr{font-size:15px}
.brand{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:700 12px Tahoma,Arial,sans-serif;color:var(--ink);opacity:.7;direction:ltr;pointer-events:none}
.screen{position:absolute;inset:0;background:radial-gradient(circle at 25% 15%,#fff 0,transparent 45%),linear-gradient(#F8BBD0,#FFF3E0 60%,#B3E5FC);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px;z-index:20}
.screen h1{font-size:clamp(34px,7dvh,54px);font-weight:900;color:var(--yellow);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 rgba(74,20,140,.3)}
.screen p{font-size:17px;font-weight:700;line-height:1.8;max-width:430px}
.tag{background:var(--ink);color:#fff;border-radius:20px;padding:6px 18px;font-weight:800;font-size:15px}
.hero{display:flex;gap:10px;align-items:center;justify-content:center}
.stars{font-size:54px;letter-spacing:6px}
.hidden{display:none!important}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
.bounce{animation:bounce .6s}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
.stamp{position:absolute;font-size:92px;z-index:5;animation:pop .6s forwards;pointer-events:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <span class="pill lv" id="lvl">مرحله ۱</span>
    <span class="pill" id="cnt">سؤال ۱ از ۱۲</span>
    <button class="iconbtn" id="snd" aria-label="صدا">🔊</button>
  </div>
  <div class="bar"><div id="prog"></div></div>
  <div class="q" id="qtext"></div>
  <div class="easel" id="easel"></div>
  <div class="mrow">
    <svg id="mas" viewBox="0 0 100 100">
      <ellipse cx="50" cy="60" rx="34" ry="32" fill="#F06292"/>
      <ellipse cx="50" cy="26" rx="30" ry="12" fill="#6A1B9A"/><circle cx="50" cy="13" r="5" fill="#6A1B9A"/>
      <circle cx="38" cy="54" r="9" fill="#fff"/><circle cx="62" cy="54" r="9" fill="#fff"/>
      <circle id="pl" cx="39" cy="55" r="4.2" fill="#222"/><circle id="pr" cx="61" cy="55" r="4.2" fill="#222"/>
      <circle cx="28" cy="68" r="5" fill="#FF8A80" opacity=".7"/><circle cx="72" cy="68" r="5" fill="#FF8A80" opacity=".7"/>
      <path id="mouth" d="M40 72 Q50 82 60 72" stroke="#4A148C" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="bubble" id="msg"></div>
  </div>
  <div class="ctrl" id="ctrl"></div>
  <div class="brand">Instagram: @zohreh_falahpour</div>

  <div class="screen" id="intro">
    <h1>رنگ کن! 🎨</h1>
    <span class="tag">ریاضی سوم دبستان · فصل کسر</span>
    <p>کسر را رنگ کن، شکل‌های هم‌اندازه را جفت کن و باغچه‌ی رنگارنگ بساز!<br>اشتباه کردی؟ نگران نباش، نقاش کوچولو راهنمایی می‌کند.</p>
    <button class="btn" id="start" style="font-size:24px;padding:12px 44px">شروع بازی</button>
    <div class="brand" style="position:static;margin-top:6px">Instagram: @zohreh_falahpour</div>
  </div>
  <div class="screen hidden" id="mid"></div>
  <div class="screen hidden" id="end"></div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const FA='۰۱۲۳۴۵۶۷۸۹'; const fa=n=>String(n).replace(/\d/g,d=>FA[d]);
const frac=(k,n)=>`<span class="fr"><b>${fa(k)}</b><i></i><b>${fa(n)}</b></span>`;
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const same=(a,b)=>a[0]*b[1]===b[0]*a[1];

/* ================= صدا ================= */
const AU={ctx:null,on:true,master:null,mus:null,timer:null,step:0,sec:null,next:0,
  init(){ if(this.ctx) return; try{ const C=window.AudioContext||window.webkitAudioContext; this.ctx=new C();
      this.master=this.ctx.createGain(); this.master.gain.value=.9; this.master.connect(this.ctx.destination);
      this.mus=this.ctx.createGain(); this.mus.gain.value=.5; this.mus.connect(this.master); }catch(e){this.ctx=null} },
  unlock(){ this.init(); if(this.ctx&&this.ctx.state!=='running') this.ctx.resume(); },
  m2f:m=>440*Math.pow(2,(m-69)/12),
  tone(f,t0,dur,type='sine',vol=.2,dest=null,slideTo=null){
    if(!this.ctx||(!this.on&&!dest)) return; const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(dest||this.master); o.start(t0); o.stop(t0+dur+.05); },
  sfx(name,x=0){ if(!this.ctx||!this.on) return; const t=this.ctx.currentTime;
    if(name==='click') this.tone(660,t,.07,'triangle',.12);
    if(name==='paint'){ this.tone(this.m2f(64+x*2),t,.14,'triangle',.18); this.tone(this.m2f(76+x*2),t+.03,.1,'sine',.07); }
    if(name==='erase') this.tone(300,t,.12,'triangle',.1,null,180);
    if(name==='good') [72,76,79,84].forEach((m,i)=>this.tone(this.m2f(m),t+i*.09,.3,'triangle',.2));
    if(name==='match'){ this.tone(this.m2f(76),t,.15,'triangle',.2); this.tone(this.m2f(83),t+.1,.25,'triangle',.2); }
    if(name==='bad'){ this.tone(330,t,.35,'sawtooth',.08,null,140); this.tone(247,t+.05,.3,'sine',.12,null,120); }
    if(name==='level') [67,71,74,79,83].forEach((m,i)=>this.tone(this.m2f(m),t+i*.1,.4,'triangle',.18));
    if(name==='win') [72,76,79,84,79,84,88].forEach((m,i)=>this.tone(this.m2f(m),t+i*.13,.45,'triangle',.2)); },
  SEC:{menu:{bpm:88,root:62,sc:[0,2,4,7,9],w:'triangle',v:.09,prob:.55},
       l1:{bpm:108,root:64,sc:[0,2,4,7,9],w:'triangle',v:.1,prob:.7},
       l2:{bpm:92,root:60,sc:[0,2,5,7,9],w:'sine',v:.11,prob:.6},
       l3:{bpm:78,root:57,sc:[0,2,4,7,11],w:'sine',v:.12,prob:.5},
       end:{bpm:100,root:65,sc:[0,2,4,7,9],w:'triangle',v:.1,prob:.7}},
  play(sec){ if(!this.ctx) return; this.stop(); this.sec=this.SEC[sec]; this.step=0; this.next=this.ctx.currentTime+.1; this.timer=setInterval(()=>this.sched(),100); },
  stop(){ if(this.timer){clearInterval(this.timer);this.timer=null} },
  sched(){ const s=this.sec; if(!s||!this.ctx) return; const dur=60/s.bpm/2;
    while(this.next<this.ctx.currentTime+.35){
      if(this.on){ const st=this.step%16,t=this.next;
        if(st%8===0) this.tone(this.m2f(s.root-12+[0,5,7,0][(this.step/8|0)%4]),t,dur*7,'sine',s.v*1.4,this.mus);
        if(st%4===2) this.tone(this.m2f(s.root+[0,4,7,4][(st/4|0)%4]),t,dur*2,'triangle',s.v*.5,this.mus);
        if(Math.random()<s.prob){ const n=s.root+12+s.sc[rnd(s.sc.length)]+(Math.random()<.2?12:0); this.tone(this.m2f(n),t,dur*1.8,s.w,s.v,this.mus); } }
      this.next+=dur; this.step++; } },
  setOn(v){ this.on=v; if(this.mus) this.mus.gain.setTargetAtTime(v?.5:0,this.ctx.currentTime,.05); }
};
['pointerup','touchend','click'].forEach(ev=>document.addEventListener(ev,()=>AU.unlock(),{passive:true}));
$('#snd').onclick=()=>{ AU.unlock(); AU.setOn(!AU.on); $('#snd').textContent=AU.on?'🔊':'🔇'; };

/* ================= نقاش کوچولو ================= */
function face(m){ const p=$('#mouth');
  p.setAttribute('d',m==='happy'?'M38 70 Q50 86 62 70':m==='sad'?'M40 78 Q50 68 60 78':m==='wow'?'M44 72 Q50 84 56 72 Q50 66 44 72':'M42 74 L58 74');
  const mas=$('#mas'); mas.classList.remove('bounce'); void mas.getBoundingClientRect(); if(m==='happy'||m==='wow') mas.classList.add('bounce'); }
function say(t,cls='',f='think'){ const b=$('#msg'); b.className='bubble '+cls; b.innerHTML=t; face(f); }

/* ================= شکل‌ها ================= */
const PAL=['#26A69A','#EC407A','#FFA726','#5C6BC0','#66BB6A','#AB47BC','#29B6F6','#EF5350'];
const GRID={2:[2,1],3:[3,1],4:[2,2],5:[5,1],6:[3,2],8:[4,2]};
const NS='http://www.w3.org/2000/svg';
function mk(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
/* دایره: n قسمت مساوی. colored: مجموعه‌ی اندیس‌های رنگی. */
function circle(n,colored,color,onTap,rot=0){
  const svg=mk('svg',{viewBox:'0 0 200 200'}); const cx=100,cy=100,r=92,cells=[];
  for(let i=0;i<n;i++){
    const a0=-Math.PI/2+i*2*Math.PI/n, a1=-Math.PI/2+(i+1)*2*Math.PI/n;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const d=n===2?`M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1} L${cx} ${cy}Z`:`M${cx} ${cy} L${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}Z`;
    const p=mk('path',{d,fill:colored&&colored.has((i+rot)%n)?color:'#fff',stroke:'#4A148C','stroke-width':3,'stroke-linejoin':'round',class:onTap?'cell':'','data-i':i},svg);
    if(onTap) p.addEventListener('click',()=>onTap(i,p)); cells.push(p);
  } return {svg,cells};
}
function rect(n,colored,color,onTap){
  const [c,r]=GRID[n], W=240, H=r===1?96:150, w=W/c, h=H/r;
  const svg=mk('svg',{viewBox:`0 0 ${W+8} ${H+8}`}), cells=[];
  for(let i=0;i<n;i++){
    const p=mk('rect',{x:(i%c)*w+4,y:Math.floor(i/c)*h+4,width:w,height:h,fill:colored&&colored.has(i)?color:'#fff',stroke:'#4A148C','stroke-width':3,class:onTap?'cell':'','data-i':i},svg);
    if(onTap) p.addEventListener('click',()=>onTap(i,p)); cells.push(p);
  } return {svg,cells};
}
/* ===== شکل‌های اضافه: مثلث، لوزی، مکعب (قسمت‌های کاملاً مساوی) ===== */
const SH_NS='http://www.w3.org/2000/svg';
function shMk(tag,attrs,parent){ const e=document.createElementNS(SH_NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
const SH_OK={circle:[2,3,4,5,6,8],rect:[2,3,4,5,6,8],tri:[2,3,4],dia:[2,4],cube:[3,4,6,8]};
const SH_NAME={circle:'دایره',rect:'مستطیل',tri:'مثلث',dia:'لوزی',cube:'مکعب'};
const shChoices=n=>Object.keys(SH_OK).filter(t=>SH_OK[t].includes(n));
function polyShape(viewBox,polys,n,colored,color,onTap,rot){
  const svg=shMk('svg',{viewBox}),cells=[];
  polys.forEach((pts,i)=>{ const p=shMk('polygon',{points:pts.map(q=>q.join(',')).join(' '),fill:colored&&colored.has((i+rot)%n)?color:'#fff',stroke:'#4A148C','stroke-width':3,'stroke-linejoin':'round',class:onTap?'cell':'','data-i':i},svg);
    if(onTap) p.addEventListener('click',()=>onTap(i,p)); cells.push(p); });
  return {svg,cells};
}
function triShape(n,colored,color,onTap,rot=0){
  const A=[110,10],B=[10,188],C=[210,188],mAB=[60,99],mAC=[160,99],mBC=[110,188],G=[110,129];
  const P={2:[[A,B,mBC],[A,mBC,C]],3:[[A,B,G],[B,C,G],[C,A,G]],4:[[A,mAB,mAC],[mAB,B,mBC],[mAC,mBC,C],[mAB,mBC,mAC]]}[n];
  return polyShape('0 0 220 198',P,n,colored,color,onTap,rot);
}
function diaShape(n,colored,color,onTap,rot=0){
  const T=[120,6],R=[234,100],B=[120,194],L=[6,100],O=[120,100];
  const P={2:[[T,L,B],[T,R,B]],4:[[T,R,O],[R,B,O],[B,L,O],[L,T,O]]}[n];
  return polyShape('0 0 240 200',P,n,colored,color,onTap,rot);
}
function cubeShape(n,colored,color,onTap,rot=0){
  const [c,r]={3:[3,1],4:[2,2],6:[3,2],8:[4,2]}[n], s=40,d=16,pitch=s+d+14, W=c*pitch+4, H=r*pitch+4;
  const svg=shMk('svg',{viewBox:`0 0 ${W} ${H}`}),cells=[];
  for(let i=0;i<n;i++){
    const x=(i%c)*pitch+4, y=Math.floor(i/c)*pitch+d+4, g=shMk('g',{class:onTap?'cell':'','data-i':i},svg);
    const on=colored&&colored.has((i+rot)%n), f=on?color:'#fff', st={stroke:'#4A148C','stroke-width':2.5,'stroke-linejoin':'round'};
    const faces=[
      shMk('polygon',Object.assign({points:`${x},${y} ${x+s},${y} ${x+s},${y+s} ${x},${y+s}`,fill:f},st),g),
      shMk('polygon',Object.assign({points:`${x},${y} ${x+d},${y-d} ${x+s+d},${y-d} ${x+s},${y}`,fill:f},st),g),
      shMk('polygon',Object.assign({points:`${x+s},${y} ${x+s+d},${y-d} ${x+s+d},${y+s-d} ${x+s},${y+s}`,fill:f},st),g)];
    shMk('polygon',{points:`${x+1},${y-1} ${x+d},${y-d+1} ${x+s+d-1},${y-d+1} ${x+s-1},${y-1}`,fill:'#fff',opacity:.4,'pointer-events':'none'},g);
    shMk('polygon',{points:`${x+s+1},${y+1} ${x+s+d-1},${y-d+1} ${x+s+d-1},${y+s-d-1} ${x+s+1},${y+s-1}`,fill:'#000',opacity:.2,'pointer-events':'none'},g);
    const orig=g.setAttribute.bind(g); g.setAttribute=(k,v)=>{ if(k==='fill') faces.forEach(q=>q.setAttribute('fill',v)); else orig(k,v); };
    if(onTap) g.addEventListener('click',()=>onTap(i,g)); cells.push(g);
  }
  return {svg,cells};
}
function mkShape(t,n,colored,color,onTap,rot=0){
  if(t==='tri') return triShape(n,colored,color,onTap,rot);
  if(t==='dia') return diaShape(n,colored,color,onTap,rot);
  if(t==='cube') return cubeShape(n,colored,color,onTap,rot);
  if(t==='circle') return circle(n,colored,color,onTap,rot);
  return rect(n,colored,color,onTap);
}
const scatter=(n,k)=>new Set(shuffle([...Array(n).keys()]).slice(0,k));
const contig=(n,k)=>new Set([...Array(k).keys()]);

/* ================= ساخت سؤال‌ها (کاملاً تصادفی) ================= */
const T1=[[2,4],[3,4],[3,4,6],[4,6],[6,8],[6,8]];
const FPOOL={1:[[1,2],[1,3],[2,3],[1,4],[3,4]],2:[[1,3],[2,3],[1,4],[3,4],[1,6],[5,6],[1,2]],3:[[1,4],[3,4],[1,6],[5,6],[1,8],[3,8],[5,8],[7,8],[2,3]]};
const CROPS=[['هویج','🥕','#FB8C00'],['کاهو','🥬','#7CB342'],['گوجه‌فرنگی','🍅','#E53935'],['خیار','🥒','#2E7D32'],['بادمجان','🍆','#7B1FA2'],['ذرت','🌽','#FDD835'],['فلفل','🌶️','#D81B60'],['سیب‌زمینی','🥔','#8D6E63']];
function build(){
  const S=[], used=new Set();
  T1.forEach(t=>{ let n,k,key,tr=0; do{ n=pick(t); k=1+rnd(n-1); key=n+'_'+k; tr++; }while(used.has(key)&&tr<40); used.add(key);
    S.push({lv:1,n,k,shape:pick(shChoices(n)),color:pick(PAL)}); });
  [1,2,3].forEach(r=>{ const pool=shuffle(FPOOL[r]); const ch=[]; for(const f of pool){ if(ch.length<3&&!ch.some(x=>same(x,f))) ch.push(f);}
    const pairs=ch.map(([k,n])=>({k,n,color:pick(PAL),rot:rnd(n),cells:scatter(n,k),shape:pick(shChoices(n).filter(t=>t!=='rect'))}));
    S.push({lv:2,pairs}); });
  for(let i=0;i<3;i++){ const n=pick(i===0?[4,6]:[6,8]); const crops=shuffle(CROPS).slice(0,pick([2,3]));
    let need,tr=0; do{ need=crops.map(()=>1+rnd(3)); tr++; }while((need.reduce((a,b)=>a+b,0)>n-1||need.reduce((a,b)=>a+b,0)<n-3)&&tr<80);
    if(need.reduce((a,b)=>a+b,0)>n-1) need=crops.map(()=>1);
    S.push({lv:3,n,crops:crops.map((c,j)=>({name:c[0],emo:c[1],color:c[2],need:need[j]}))}); }
  return S;
}

/* ================= حالت بازی ================= */
let S,si,score,att,mist,col,sel,locked,round,M;
const easel=$('#easel'),ctrl=$('#ctrl');
function show(id){ ['intro','mid','end'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id)); }
function startGame(){ S=build(); si=0; score=0; mist={comp:0,count:0,over:0,den:0,pair:0,garden:0}; show('none'); AU.play('l1'); load(); }
function head(){ const s=S[si];
  $('#lvl').textContent=['','مرحله ۱ · رنگ کن','مرحله ۲ · جفت کن','مرحله ۳ · باغچه'][s.lv];
  $('#cnt').textContent=`سؤال ${fa(si+1)} از ${fa(S.length)}`; $('#prog').style.width=(si/S.length*100)+'%'; }
function stamp(){ const e=document.createElement('div'); e.className='stamp'; e.textContent=pick(['⭐','🌟','🎉','✨']); e.style.left='calc(50% - 46px)'; e.style.top='30%'; easel.appendChild(e); setTimeout(()=>e.remove(),900); }
function load(){ locked=false; att=0; head(); const s=S[si]; [load1,load2,load3][s.lv-1](s); }
function done(good){ locked=true; if(good){ stamp(); confetti(16); AU.sfx('good'); } setTimeout(advance,good?1500:2600); }
function advance(){ si++; if(si>=S.length) return finish();
  if(S[si].lv!==S[si-1].lv){ AU.sfx('level'); const l=S[si].lv; AU.play(l===2?'l2':'l3'); const m=$('#mid');
    m.innerHTML=l===2?`<h1>مرحله ۲ 🔗</h1><span class="tag">جفت کن</span><p>هر شکل رنگی (دایره، مثلث، لوزی یا مکعب) را با مستطیلی که <b>همان کسر</b> را نشان می‌دهد جفت کن. اول یک شکل، بعد یک مستطیل را انتخاب کن.</p><button class="btn" id="g">برویم!</button>`
      :`<h1>مرحله ۳ 🌻</h1><span class="tag">باغچه‌ی رنگارنگ</span><p>مسئله را بخوان، باغچه را رنگ کن و پیدا کن چه کسری از باغچه خالی مانده است.</p><button class="btn" id="g">برویم!</button>`;
    show('mid'); $('#g').onclick=()=>{ AU.sfx('click'); show('none'); load(); }; return; }
  load(); }

/* ---------- مرحله ۱: رنگ کن ---------- */
function load1(s){
  col=new Set(); $('#qtext').innerHTML=`این کسر را رنگ کن: <span class="big">${frac(s.k,s.n)}</span>`;
  easel.innerHTML='';
  const tap=(i,p)=>{ if(locked) return; if(col.has(i)){ col.delete(i); p.setAttribute('fill','#fff'); AU.sfx('erase'); } else { col.add(i); p.setAttribute('fill',s.color); AU.sfx('paint',col.size); } upd(); };
  const sh=mkShape(s.shape,s.n,null,s.color,tap);
  easel.appendChild(sh.svg); s.cells=sh.cells;
  say(`شکل ${fa(s.n)} قسمت مساوی دارد. روی قسمت‌ها بزن تا رنگ شوند 🖌️`,'', 'think');
  ctrl.innerHTML=`<button class="btn sec" id="clr">پاک کن</button><button class="btn go" id="chk" disabled>بررسی ✔</button>`;
  $('#clr').onclick=()=>{ if(locked) return; col.clear(); s.cells.forEach(c=>c.setAttribute('fill','#fff')); AU.sfx('erase'); upd(); };
  $('#chk').onclick=()=>check1(s);
  function upd(){ $('#chk').disabled=col.size===0; }
  window.__dbg={s,col};
}
function check1(s){ if(locked) return; const c=col.size;
  if(c===s.k){ say('آفرین! 🎉 '+frac(s.k,s.n)+' یعنی '+fa(s.k)+' قسمت رنگی از '+fa(s.n)+' قسمت مساوی.','ok','happy'); if(att===0) score++; done(true); return; }
  att++; AU.sfx('bad'); easel.classList.add('shake'); setTimeout(()=>easel.classList.remove('shake'),460);
  let why; if(c===s.n-s.k&&c!==s.k){ mist.comp++; why=`انگار ${fa(c)} قسمت رنگ کردی؛ این تعداد قسمت‌های بدون‌رنگ است. صورت کسر یعنی چند قسمت <b>رنگی</b>.`; }
  else if(c<s.k){ mist.count++; why='هنوز کمتر از لازم رنگ کرده‌ای.'; } else { mist.over++; why='بیشتر از لازم رنگ کرده‌ای.'; }
  if(att===1) say('دوباره فکر کن 🙂 '+why,'bad','think');
  else if(att===2) say(`مخرج ${fa(s.n)} یعنی شکل ${fa(s.n)} قسمت مساوی دارد. صورت ${fa(s.k)} یعنی دقیقاً <b>${fa(s.k)}</b> قسمت را رنگ کن.`,'bad','think');
  else { locked=true; col=new Set(shuffle([...Array(s.n).keys()]).slice(0,s.k)); s.cells.forEach((p,i)=>p.setAttribute('fill',col.has(i)?s.color:'#fff'));
    say(`این‌طوری: ${frac(s.k,s.n)} = ${fa(s.k)} قسمت رنگی از ${fa(s.n)} قسمت.`,'','think'); done(false); } }

/* ---------- مرحله ۲: جفت کن ---------- */
function load2(s){
  $('#qtext').textContent='هر شکل را با مستطیلِ هم‌کسر جفت کن'; easel.innerHTML=''; ctrl.innerHTML='';
  const grid=document.createElement('div'); grid.className='mgrid'; easel.appendChild(grid);
  const L=s.pairs.map((p,i)=>({id:i,p,side:'L'})), R=shuffle(s.pairs.map((p,i)=>({id:i,p,side:'R'})));
  const colL=L, colR=R; M={sel:null,left:L.length,mist:0,s};
  const rows=[]; for(let r=0;r<3;r++) rows.push([colL[r],colR[r]]);
  rows.flat().forEach(it=>{ const d=document.createElement('div'); d.className='card'; const p=it.p;
    const g=it.side==='L'?mkShape(p.shape,p.n,contig(p.n,p.k),p.color,null,p.rot):rect(p.n,p.cells,p.color,null);
    d.appendChild(g.svg); const lb=document.createElement('div'); lb.className='lbl'; d.appendChild(lb); it.el=d; it.lb=lb;
    d.onclick=()=>tap2(it); grid.appendChild(d); });
  // ترتیب نمایش: ستون راست دایره‌ها؟ — در RTL اولین آیتم هر ردیف سمت راست است
  M.all=rows.flat();
  say('اول یک شکل، بعد یک مستطیل را انتخاب کن.','', 'think'); window.__dbg={s,M};
}
function tap2(it){ if(locked||it.el.classList.contains('done')) return; AU.sfx('click');
  if(!M.sel){ M.sel=it; it.el.classList.add('sel'); return; }
  if(M.sel===it){ it.el.classList.remove('sel'); M.sel=null; return; }
  if(M.sel.side===it.side){ M.sel.el.classList.remove('sel'); M.sel=it; it.el.classList.add('sel'); return; }
  const a=M.sel, b=it; a.el.classList.remove('sel'); M.sel=null;
  if(a.id===b.id){ [a,b].forEach(x=>{ x.el.classList.add('done'); x.lb.innerHTML=frac(x.p.k,x.p.n); }); AU.sfx('match'); M.left--; say('درست جفت کردی! 👏','ok','happy');
    if(M.left===0){ if(M.mist===0) score++; say('همه را درست جفت کردی! 🎉','ok','happy'); done(true); } }
  else { M.mist++; mist.pair++; AU.sfx('bad'); [a.el,b.el].forEach(e=>{ e.classList.add('shake'); setTimeout(()=>e.classList.remove('shake'),460); });
    say('این دو شکل کسر یکسانی ندارند. قسمت‌های رنگی و کل قسمت‌ها را بشمار 🤔','bad','think'); } }

/* ---------- مرحله ۳: باغچه ---------- */
function load3(s){
  const total=s.crops.reduce((a,c)=>a+c.need,0), rem=s.n-total; s.rem=rem; s.total=total;
  const story=s.crops.map(c=>`${fa(c.need)} قسمت ${c.name} ${c.emo}`).join(' و ');
  $('#qtext').innerHTML=`یک باغچه ${fa(s.n)} قسمت مساوی دارد. در آن ${story} کاشتند.`;
  easel.innerHTML=''; s.assign=new Array(s.n).fill(-1); sel=0; s.stage=1;
  const [c,r]=GRID[s.n], W=240,H=r===1?96:150,w=W/c,h=H/r, svg=mk('svg',{viewBox:`0 0 ${W+8} ${H+8}`}); s.cellEls=[]; s.emoEls=[];
  for(let i=0;i<s.n;i++){ const x=(i%c)*w+4,y=Math.floor(i/c)*h+4;
    const el=mk('rect',{x,y,width:w,height:h,fill:'#EFEBE9',stroke:'#5D4037','stroke-width':3,class:'cell'},svg);
    const em=mk('text',{x:x+w/2,y:y+h/2+9,'text-anchor':'middle','font-size':Math.min(w,h)*.5},svg); em.style.pointerEvents='none';
    el.addEventListener('click',()=>{ if(locked||s.stage!==1) return; const cur=s.assign[i];
      if(cur===sel){ s.assign[i]=-1; AU.sfx('erase'); } else { s.assign[i]=sel; AU.sfx('paint',s.assign.filter(v=>v>=0).length); } draw3(s); });
    s.cellEls.push(el); s.emoEls.push(em); }
  easel.appendChild(svg); say('یک گیاه را انتخاب کن و روی قسمت‌های باغچه بزن 🌱','', 'think'); stage1(s); draw3(s); window.__dbg={s};
}
function stage1(s){
  ctrl.innerHTML=`<div class="chips" id="chips" style="width:100%"></div><button class="btn go" id="chk3" disabled>بررسی ✔</button>`;
  const ch=$('#chips'); s.crops.forEach((c,j)=>{ const d=document.createElement('div'); d.className='chip'+(j===sel?' sel':''); d.id='ch'+j;
    d.innerHTML=`<span class="dot" style="background:${c.color}"></span>${c.emo} ${c.name}: <b>${fa(c.need)} قسمت</b> · کاشتی: <span id="cn${j}">۰</span>`; d.onclick=()=>{ sel=j; AU.sfx('click'); draw3(s); }; ch.appendChild(d); });
  $('#chk3').onclick=()=>check3a(s);
}
function draw3(s){ s.assign.forEach((v,i)=>{ s.cellEls[i].setAttribute('fill',v>=0?s.crops[v].color:'#EFEBE9'); s.emoEls[i].textContent=v>=0?s.crops[v].emo:''; });
  s.crops.forEach((c,j)=>{ const n=s.assign.filter(v=>v===j).length; const e=$('#cn'+j); if(e) e.textContent=fa(n); const ch=$('#ch'+j); if(ch) ch.classList.toggle('sel',j===sel); });
  const b=$('#chk3'); if(b) b.disabled=!s.assign.some(v=>v>=0); }
function check3a(s){ if(locked) return; const bad=s.crops.findIndex((c,j)=>s.assign.filter(v=>v===j).length!==c.need);
  if(bad<0){ s.stage=2; AU.sfx('match'); say('باغچه را درست رنگ کردی! 👏','ok','happy'); setTimeout(()=>stage2(s),900); return; }
  att++; mist.garden++; AU.sfx('bad'); const c=s.crops[bad], n=s.assign.filter(v=>v===bad).length;
  say(`${c.name} باید ${fa(c.need)} قسمت باشد، ولی ${fa(n)} قسمت گذاشته‌ای. دوباره امتحان کن 🙂`,'bad','think'); }
function stage2(s){
  $('#qtext').innerHTML=`چه کسری از باغچه <b>خالی</b> مانده است؟`;
  say(`کل قسمت‌ها ${fa(s.n)} تاست. چند قسمت کاشته شده؟ بقیه خالی است 🤔`,'','think');
  const ds=[]; const add=(a,b,t)=>{ if(a<1||b<2||a>=b) return; const v=[a,b]; if(same(v,[s.rem,s.n])||ds.some(x=>same(x.v,v))) return; ds.push({v,t}); };
  add(s.total,s.n,'full'); add(s.rem+1,s.n,'num'); add(s.rem,s.total,'den'); add(Math.max(1,s.rem-1),s.n,'num'); add(s.rem,s.n+1,'den'); add(1,2,'o'); add(1,3,'o'); add(3,4,'o');
  s.opts=shuffle([{v:[s.rem,s.n],t:'right'},...ds.slice(0,3)]);
  ctrl.innerHTML=''; s.opts.forEach((o,i)=>{ const b=document.createElement('button'); b.className='opt'; b.innerHTML=frac(o.v[0],o.v[1]); b.onclick=()=>pick3(s,o,b); ctrl.appendChild(b); });
}
function pick3(s,o,b){ if(locked) return; AU.sfx('click');
  if(o.t==='right'){ if(att===0) score++; say(`درست است! ${frac(s.rem,s.n)} — ${fa(s.n)} منهای ${fa(s.total)} می‌شود ${fa(s.rem)}.`,'ok','happy'); [...ctrl.children].forEach(x=>x.classList.add('off')); b.classList.remove('off'); b.classList.add('glow'); done(true); return; }
  att++; mist.garden++; AU.sfx('bad'); b.classList.add('off');
  if(att===1) say(o.t==='full'?'این کسر قسمت‌های <b>کاشته‌شده</b> است. ما قسمت‌های خالی را می‌خواهیم.':'دوباره فکر کن 🙂 کل قسمت‌ها را از قسمت‌های کاشته‌شده کم کن.','bad','think');
  else { locked=true; [...ctrl.children].forEach((x,i)=>{ x.classList.toggle('glow',s.opts[i].t==='right'); if(s.opts[i].t!=='right') x.classList.add('off'); });
    say(`جواب: ${frac(s.rem,s.n)} — ${fa(s.n)} − ${fa(s.total)} = ${fa(s.rem)} قسمت خالی.`,'','think'); done(false); } }

/* ---------- پایان ---------- */
function finish(){ AU.play('end'); AU.sfx('win'); confetti(50); $('#prog').style.width='100%';
  const st=score>=11?3:score>=8?2:1;
  const top=Object.entries(mist).sort((a,b)=>b[1]-a[1])[0];
  const tip=top&&top[1]>0?{comp:'یادت باشد: صورت = قسمت‌های رنگی، نه بدون‌رنگ.',count:'قسمت‌های رنگی را با دقت بشمار.',over:'فقط به‌اندازه‌ی صورت کسر رنگ کن.',den:'همه‌ی قسمت‌ها را با دقت بشمار.',pair:'در جفت‌کردن، هم قسمت‌های رنگی و هم کل قسمت‌ها را بشمار.',garden:'خالی = کل قسمت‌ها − قسمت‌های کاشته‌شده.'}[top[0]]:'';
  $('#end').innerHTML=`<h1>آفرین! 🏆</h1><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><span class="tag">${fa(score)} سؤال درست در تلاش اول از ${fa(S.length)}</span>
   <p><b>یادآوری:</b> مخرج = تعداد همه‌ی قسمت‌های مساوی<br>صورت = تعداد قسمت‌های رنگی${tip?'<br><br>'+tip:''}</p>
   <button class="btn" id="again" style="font-size:22px;padding:11px 40px">دوباره بازی کن</button>
   <p style="font-size:15px">Instagram: <span dir="ltr">@zohreh_falahpour</span></p>`;
  show('end'); $('#again').onclick=()=>{ AU.sfx('click'); startGame(); }; }
function confetti(n){ const cols=['#FFD54F','#EC407A','#26A69A','#29B6F6','#AB47BC'];
  for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='conf'; d.style.left=Math.random()*100+'vw'; d.style.background=pick(cols); document.body.appendChild(d);
    d.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(${innerHeight+40}px) rotate(${360+rnd(360)}deg)`,opacity:.8}],{duration:1400+rnd(900),easing:'ease-in'}).onfinish=()=>d.remove(); } }
$('#start').onclick=()=>{ AU.unlock(); AU.sfx('click'); startGame(); };
document.addEventListener('pointerup',()=>{ if(AU.ctx&&!AU.timer) AU.play('menu'); },{once:true});
</script>
