<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ماجرای قطره‌ی کوچولو</title>
<style>
:root{--blue:#29a8f0;--dark:#0b4f7a;--yellow:#ffd54f;--orange:#ff8f00;--green:#66bb6a;--red:#ef5350;--bg:#e3f6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(#bfe9ff,#e8f8ff 60%,#d7f2c8);font-family:Tahoma,"Vazirmatn","Segoe UI",Arial,sans-serif;color:var(--dark)}
#app{max-width:760px;margin:0 auto;padding:10px 12px 40px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.steps{display:flex;gap:6px;flex:1}
.dot{flex:1;height:10px;border-radius:6px;background:#b7dff5}
.dot.on{background:var(--orange)}
.dot.done{background:var(--green)}
.pill{background:#fff;border:3px solid var(--yellow);border-radius:20px;padding:4px 12px;font-weight:bold;white-space:nowrap}
.icon-btn{border:0;background:#fff;border-radius:50%;width:42px;height:42px;font-size:20px;box-shadow:0 2px 0 #b7dff5}
.guide{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.guide svg{width:76px;height:84px;flex:none}
.bubble{background:#fff;border:3px solid var(--blue);border-radius:18px;padding:10px 14px;font-size:17px;line-height:1.8;position:relative;flex:1}
.bubble:before{content:"";position:absolute;right:-12px;top:22px;border:8px solid transparent;border-left-color:var(--blue);transform:rotate(180deg)}
h1{font-size:30px;margin:6px 0;text-align:center}
h2{font-size:20px;margin:8px 0;text-align:center}
.card{background:#fff;border:4px solid #fff;border-radius:18px;box-shadow:0 4px 0 #9fd3ee;overflow:hidden;text-align:center;cursor:pointer;font-family:inherit;color:var(--dark);padding:0}
.card svg{display:block;width:100%;height:auto}
.card .lbl{font-weight:bold;font-size:17px;padding:6px 4px 0}
.card .cap{font-size:12.5px;padding:0 6px 8px;color:#35708f;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.slot{border:4px dashed #8fcdee;border-radius:18px;min-height:150px;position:relative;background:rgba(255,255,255,.55);display:flex;align-items:stretch}
.slot .num{position:absolute;top:-4px;right:-4px;background:var(--orange);color:#fff;width:34px;height:34px;border-radius:0 14px 0 14px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;z-index:2}
.slot .card{flex:1;border-radius:14px;box-shadow:none;border:0}
.slot.bad{border-color:var(--red);background:#ffe3e3;animation:shake .4s}
.slot.good{border-color:var(--green);border-style:solid}
.btn{display:block;margin:14px auto 0;background:var(--yellow);border:4px solid var(--orange);border-radius:20px;font-size:21px;font-weight:bold;padding:10px 28px;color:#3b2a00;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #c96f00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c96f00}
.btn[disabled]{opacity:.45}
.btn.small{font-size:16px;padding:6px 16px;display:inline-block;margin:8px 4px 0}
.btn.alt{background:#fff;border-color:var(--blue);color:var(--dark);box-shadow:0 4px 0 #8fcdee}
input[type=text]{width:100%;font-size:26px;text-align:center;padding:10px;border:4px solid var(--blue);border-radius:16px;font-family:inherit;color:var(--dark);outline:none;direction:rtl}
input[type=text]:focus{border-color:var(--orange)}
input.bad{animation:shake .4s;border-color:var(--red)}
.big-scene{background:#fff;border:4px solid #fff;border-radius:20px;box-shadow:0 4px 0 #9fd3ee;overflow:hidden;margin:8px 0}
.big-scene svg{display:block;width:100%;height:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{background:#fff;border:4px solid var(--blue);border-radius:16px;padding:14px 8px;font-size:18px;font-weight:bold;font-family:inherit;color:var(--dark);cursor:pointer;box-shadow:0 4px 0 #8fcdee;min-height:64px}
.opt.good{background:#c8f7c5;border-color:var(--green)}
.opt.bad{background:#ffd6d6;border-color:var(--red)}
.q{background:#fff;border-radius:18px;border:4px solid var(--yellow);padding:14px;font-size:20px;line-height:1.9;text-align:center;font-weight:bold}
.timer{height:14px;background:#cfe9f7;border-radius:8px;overflow:hidden;margin:10px 0}
.timer>div{height:100%;background:var(--green);width:100%;transition:width .1s linear,background .3s}
.hearts{font-size:26px;letter-spacing:2px}
.stars{font-size:64px;text-align:center;margin:10px 0}
.center{text-align:center}
.score-big{font-size:42px;font-weight:bold;color:var(--orange);text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(540deg);opacity:.9}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pop{animation:pop .35s}
.mascot-bob{animation:bob 2s ease-in-out infinite}
.confetti{position:fixed;top:0;width:10px;height:14px;z-index:50;animation:fall 2.2s ease-in forwards;pointer-events:none}
.hint{margin-top:6px;color:#b45f00;font-weight:bold;text-align:center;min-height:26px}
</style>
</head>

/* ---------- صدا ---------- */
let music = null, musicOn = true, musicPlaying = false, actx = null;
function startMusic() {
  if (!musicOn || musicPlaying) return;
  try {
    if (!music) { music = new Audio(MUSIC_SRC); music.loop = true; music.volume = 0.5; }
    const p = music.play();
    if (p && p.then) p.then(() => { musicPlaying = true; }).catch(() => { musicPlaying = false; });
    else musicPlaying = true;
  } catch (e) {}
}
["pointerup", "touchend", "click"].forEach(ev => document.addEventListener(ev, startMusic, {passive: true}));
function toggleMusic() {
  musicOn = !musicOn;
  if (!musicOn) { if (music) music.pause(); musicPlaying = false; } else startMusic();
  const b = $("#musicBtn"); if (b) b.textContent = musicOn ? "🔊" : "🔇";
}
function beep(seq) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    seq.forEach(([f, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + 0.02); t += d;
    });
  } catch (e) {}
}
const sndGood = () => beep([[660, .12], [880, .18]]);
const sndBad = () => beep([[260, .18], [200, .25]]);
const sndWin = () => beep([[523, .12], [659, .12], [784, .12], [1047, .3]]);

function confetti(n = 40) {
  n = Math.round(n * 0.6);
  const cols = ["#ffd54f", "#29a8f0", "#66bb6a", "#ef5350", "#ab47bc", "#ff8f00"];
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.className = "confetti";
    s.style.left = Math.random() * 100 + "vw";
    s.style.background = cols[i % cols.length];
    s.style.animationDelay = Math.random() * .5 + "s";
    s.style.borderRadius = i % 2 ? "50%" : "2px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 3000);
  }
}

}
function sun(x, y, r) {
  let rays = "";
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    rays += `<line x1="${x + Math.cos(a) * (r + 5)}" y1="${y + Math.sin(a) * (r + 5)}" x2="${x + Math.cos(a) * (r + 15)}" y2="${y + Math.sin(a) * (r + 15)}" stroke="#ffb300" stroke-width="4" stroke-linecap="round"/>`;
  }
  return `${rays}<circle cx="${x}" cy="${y}" r="${r}" fill="#ffd54f" stroke="#ffb300" stroke-width="3"/>
  <circle cx="${x - r * .35}" cy="${y - r * .15}" r="${r * .1}" fill="#5d4037"/><circle cx="${x + r * .35}" cy="${y - r * .15}" r="${r * .1}" fill="#5d4037"/>
  <path d="M${x - r * .4} ${y + r * .2} Q${x} ${y + r * .65} ${x + r * .4} ${y + r * .2}" fill="none" stroke="#5d4037" stroke-width="2.5" stroke-linecap="round"/>`;
}
function sea(y, c1 = "#29a8f0", c2 = "#5cc2f7") {
  const w = (yy, c) => `<path d="M0 ${yy} Q25 ${yy - 9} 50 ${yy} T100 ${yy} T150 ${yy} T200 ${yy} T250 ${yy} T300 ${yy} V200 H0Z" fill="${c}"/>`;
  return w(y, c2) + w(y + 10, c1);
}
function cloud(cx, cy, s, fill, face) {
  const f = face ? `<circle cx="${cx - 12 * s}" cy="${cy + 2 * s}" r="${3 * s}" fill="#0b4f7a"/><circle cx="${cx + 12 * s}" cy="${cy + 2 * s}" r="${3 * s}" fill="#0b4f7a"/>
  <path d="M${cx - 8 * s} ${cy + 10 * s} Q${cx} ${cy + 17 * s} ${cx + 8 * s} ${cy + 10 * s}" fill="none" stroke="#0b4f7a" stroke-width="${2.2 * s}" stroke-linecap="round"/>` : "";
  return `<g fill="${fill}"><circle cx="${cx - 28 * s}" cy="${cy + 6 * s}" r="${16 * s}"/><circle cx="${cx - 8 * s}" cy="${cy - 8 * s}" r="${22 * s}"/>
  <circle cx="${cx + 18 * s}" cy="${cy - 2 * s}" r="${19 * s}"/><circle cx="${cx + 36 * s}" cy="${cy + 8 * s}" r="${14 * s}"/><rect x="${cx - 40 * s}" y="${cy + 6 * s}" width="${92 * s}" height="${16 * s}" rx="${8 * s}"/></g>${f}`;
}
function drop(x, y, s = 1, c = "#29a8f0") {
  return `<path d="M${x} ${y - 9 * s} C ${x + 6 * s} ${y - 1 * s}, ${x + 8 * s} ${y + 2 * s}, ${x + 8 * s} ${y + 5 * s} A${8 * s} ${8 * s} 0 1 1 ${x - 8 * s} ${y + 5 * s} C ${x - 8 * s} ${y + 2 * s} ${x - 6 * s} ${y - 1 * s} ${x} ${y - 9 * s}Z" fill="${c}" stroke="#0288d1" stroke-width="1.5"/>`;

function arrowUp(x, y1, y2) {
  return `<path d="M${x} ${y1} q8 -${(y1 - y2) / 4} 0 -${(y1 - y2) / 2} q-8 -${(y1 - y2) / 4} 0 -${(y1 - y2) / 2}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".95"/>
  <path d="M${x - 8} ${y2 + 9} L${x} ${y2} L${x + 8} ${y2 + 9}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function scene(kind, variant) {
  const id = "g" + (++uid);
  let sky = "#bfe9ff", body = "";
  if (kind === "evap") {
    body = sea(150) + sun(245, 42, 24) + arrowUp(80, 140, 62) + arrowUp(130, 135, 52) + arrowUp(180, 140, 72);
  } else if (kind === "cloud") {
    sky = "#d4e8f7";
    body = sea(168) + `<circle cx="95" cy="135" r="4" fill="#fff"/><circle cx="130" cy="120" r="5" fill="#fff"/><circle cx="170" cy="130" r="4" fill="#fff"/><circle cx="205" cy="118" r="5" fill="#fff"/>
    <circle cx="150" cy="104" r="3.5" fill="#fff"/><circle cx="118" cy="98" r="3.5" fill="#fff"/>` + cloud(150, 62, 1.35, "#fff", true) + sun(265, 28, 16);
  } else if (kind === "rain") {
    sky = "#aebfd1";
    let rain = "";
    for (let i = 0; i < 9; i++) rain += drop(98 + i * 13, 108 + (i % 3) * 18, .8);
    const snow = `<g stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="50" y1="124" x2="50" y2="154"/><line x1="35" y1="132" x2="65" y2="146"/><line x1="35" y1="146" x2="65" y2="132"/></g>`;

    body = `<rect x="0" y="170" width="300" height="30" fill="#7cb342"/>` + cloud(150, 52, 1.5, "#8097ad", true) + rain + snow + hail;
  } else if (kind === "ground") {
    const absorb = variant === "absorb" || variant === "both";
    const run = variant === "runoff" || variant === "both";
    let rain = "";
    for (let i = 0; i < 5; i++) rain += drop(40 + i * 28, 40 + (i % 2) * 22, .7);
    body = `<rect x="0" y="125" width="300" height="75" fill="#8d6e63"/><rect x="0" y="118" width="300" height="12" rx="6" fill="#7cb342"/>` + sea(176, "#29a8f0", "#5cc2f7").replace(/V200 H0Z/g, "V200 H300Z");
    body = `<rect x="0" y="118" width="300" height="82" fill="#8d6e63"/><rect x="0" y="112" width="300" height="12" rx="6" fill="#7cb342"/>`;
    if (run) body += `<path d="M150 118 C 190 108, 215 130, 300 138 L300 158 C 220 150 190 132 150 124Z" fill="#4fc3f7"/><path d="M265 150 l-22 -4 m22 4 l-8 -14" stroke="#fff" stroke-width="0"/>
      <path d="M225 128 l16 8 l-18 2" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (absorb) body += `<g>${drop(45, 138, .9)}${drop(80, 152, .9)}${drop(110, 168, .9)}${drop(62, 175, .8)}</g>
      <path d="M62 120 L62 186" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/><path d="M52 176 L62 188 L72 176" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
    body += cloud(70, 34, .9, "#8097ad", false) + rain.replace(/>/g, ">");
    sky = "#c9d9e6";
    if (!absorb || !run) {}
  }
  return `<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky}"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
  <rect width="300" height="200" fill="url(#${id})"/>${body}</svg>`;
}

/* ---------- ابزارها ---------- */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.replace(/ي/g, "ی").replace(/ك/g, "ک").replace(/[‌‏‎\s‌]/g, "").replace(/[ً-ٟ]/g, "").replace(/[‌-]/g, "").trim();
let score = 0, level = 0;

function header(active) {
  const dots = [0, 1, 2, 3].map(i => `<div class="dot ${i < active ? "done" : i === active ? "on" : ""}"></div>`).join("");
  return `<header><button class="icon-btn" id="musicBtn" onclick="toggleMusic()">${musicOn ? "🔊" : "🔇"}</button><div class="steps">${dots}</div><div class="pill">⭐ ${score}</div></header>`;
}
function guide(msg, mood) {
  return `<div class="guide">${mascot(mood)}<div class="bubble" id="bubble">${msg}</div></div>`;
}
function say(msg) { const b = $("#bubble"); if (b) b.innerHTML = msg; }
function cardHTML(s, withCap = true) {
  return `${scene(s.kind, s.variant)}<div class="lbl">${s.name}</div>${withCap ? `<div class="cap">${s.cap}</div>` : ""}`;
}

/* ---------- مرحله‌ی ۱: بچین ---------- */
function level1() {
  level = 1;
  let slots = [null, null, null, null];
  let pool = shuffle(STEPS.map(s => s.id));
  let tries = 0;
  function render(bad) {
    const slotHTML = slots.map((id, i) => {
      const cls = bad && bad.includes(i) ? "bad" : "";
      return `<div class="slot ${cls}"><div class="num">${i + 1}</div>${id !== null ? `<button class="card" onclick="L1.back(${i})">${cardHTML(STEPS[id], false)}</button>` : ""}</div>`;
    }).join("");
    const poolHTML = pool.map(id => `<button class="card" onclick="L1.put(${id})">${cardHTML(STEPS[id])}</button>`).join("");
    const full = slots.every(x => x !== null);
    $("#play").innerHTML = `<h2>جای هر کارت را درست کن</h2><div class="grid">${slotHTML}</div>
    ${pool.length ? `<h2>کارت‌ها</h2><div class="grid">${poolHTML}</div>` : ""}
    <button class="btn" ${full ? "" : "disabled"} onclick="L1.check()">بررسی کن ✅</button>`;
  }
  window.L1 = {
    put(id) {
      const i = slots.indexOf(null); if (i < 0) return;
      slots[i] = id; pool = pool.filter(x => x !== id); render();
    },
    back(i) { pool.push(slots[i]); slots[i] = null; render(); },
    check() {
      tries++;
      const bad = slots.map((id, i) => id === i ? -1 : i).filter(i => i >= 0);
      if (!bad.length) {
        const pts = tries === 1 ? 30 : tries === 2 ? 15 : 5; score += pts;
        sndWin(); confetti(); 
        app.innerHTML = header(1) + guide("آفرین! 🎉 ترتیب چرخه‌ی آب را درست چیدی!<br>اول تبخیر، بعد تشکیل ابر، بعد بارش و آخر جذب در خاک یا رواناب.") +
          `<div class="center score-big">+${pts}</div><button class="btn" onclick="level2()">مرحله‌ی بعد: بنویس ✍️</button>`;
      } else {
        sndBad();
        const wrong = bad.map(i => slots[i]);
        render(bad);
        say(tries >= 2 ? "نزدیکی! یادت باشد: اول <b>خورشید</b> آب را گرم می‌کند. هر جای قرمز را عوض کن 🙂" : "یک چیزی جابه‌جاست 🤔 کارت‌های قرمز را بردار و دوباره بگذار.");
        setTimeout(() => { bad.forEach(i => { pool.push(slots[i]); slots[i] = null; }); render(); }, 900);
      }
    }
  };
  app.innerHTML = header(0) + guide("مرحله‌ی ۱: <b>بچین!</b><br>چهار کارت داریم. اول تبخیر کجاست؟ کارت‌ها را به ترتیب سفر قطره بچین. روی کارت بزن تا برود توی جایش.") + `<div id="play"></div>`;
  render();
}

/* ---------- مرحله‌ی ۲: بنویس ---------- */
function level2() {
  level = 2;
  let idx = 0, tries = 0, hinted = false;
  const items = TYPING;
  function show() {
    const it = items[idx]; tries = 0; hinted = false;
    app.innerHTML = header(1) + guide(`مرحله‌ی ۲: <b>بنویس!</b> (${idx + 1} از ${items.length})<br>${it.q}`) +
      `<div class="big-scene">${scene(it.kind, it.variant)}</div>
      <input type="text" id="ans" placeholder="جواب را اینجا بنویس" autocomplete="off" autocapitalize="off" spellcheck="false" lang="fa">
      <div class="hint" id="hint"></div>
      <div class="center"><button class="btn small" onclick="L2.check()">بررسی ✅</button><button class="btn small alt" onclick="L2.help()">کمک 💡</button></div>`;
    const inp = $("#ans");
    inp.addEventListener("keydown", e => { if (e.key === "Enter") L2.check(); });
    setTimeout(() => { const e = $("#ans"); if (e) e.focus(); }, 100);
  }
  function next(pts, msg) {
    score += pts; 
    if (pts) { sndGood(); confetti(18); } else sndBad();
    const last = idx === items.length - 1;
    app.innerHTML = header(1) + guide(msg, pts ? "" : "sad") + `<div class="center score-big">${pts ? "+" + pts : "—"}</div>
      <button class="btn" onclick="L2.go()">${last ? "مرحله‌ی ماجرای من ✏️" : "بعدی ⬅️"}</button>`;
  }
  window.L2 = {
    check() {
      const it = items[idx]; const v = norm($("#ans").value);
      if (!v) return;
      const ok = it.ans.map(norm).includes(v);
      if (ok) { next(hinted || tries ? 5 : 10, "درست است! 👏 <b>" + (it.ans[0] === "ابر" ? "تشکیل ابر" : it.ans[0]) + "</b>"); return; }
      tries++; sndBad();
      const inp = $("#ans"); inp.classList.remove("bad"); void inp.offsetWidth; inp.classList.add("bad");
      if (tries >= 3) { next(0, "اشکالی ندارد! جواب درست: <b>" + (it.ans[0] === "ابر" ? "تشکیل ابر" : it.ans[0]) + "</b>. دفعه‌ی بعد یادت می‌ماند 💪"); return; }
      $("#hint").textContent = tries === 1 ? "نزدیک شدی! دوباره فکر کن 🙂" : "یک کمک: جواب با «" + it.first + "» شروع می‌شود";
    },
    help() { hinted = true; $("#hint").textContent = "جواب با «" + items[idx].first + "» شروع می‌شود (امتیاز کمتر)"; },
    go() { idx++; if (idx >= items.length) story(); else show(); }
  };
  show();
}

      const raw = $("#tx").value.trim();
      if (raw.length < 6) { sndBad(); $("#fb").textContent = "یک جمله‌ی کامل‌تر بنویس 🙂"; return; }
      const n = norm(raw); const found = p.kw.filter(k => n.includes(norm(k)));
      const pts = found.length ? 10 : 5; score += pts; texts.push(raw); sndGood(); confetti(16);
      const msg = found.length ? `عالی! کلمه‌ی «${found[0]}» را نوشتی 👏 (+${pts})` : `ثبت شد (+${pts}). دفعه‌ی بعد سعی کن کلمه‌ی «${p.kw[0]}» را هم بنویسی 😉`;
      app.innerHTML = header(2) + guide(msg) + `<div class="center score-big">+${pts}</div><button class="btn" id="nx">${idx === parts.length - 1 ? "کتاب ماجرای من 📖" : "بخش بعدی ⬅️"}</button>`;
      $("#nx").onclick = () => { idx++; if (idx >= parts.length) book(); else part(); };
    };
    setTimeout(() => { const e = $("#tx"); if (e) e.focus(); }, 100);
  }
  function book() {
    sndWin(); confetti(40);
    app.innerHTML = header(2) + `<h2>📖 ماجرای ${esc(name)}</h2>` +
      parts.map((p, i) => `<div class="big-scene" style="margin:10px 0"><div style="padding:8px 12px 0;font-weight:bold">${i + 1}. ${p.t}</div>${scene(p.kind, p.variant)}<div style="padding:10px 14px;font-size:18px;line-height:2">${esc(texts[i])}</div></div>`).join("") +
      `<div class="guide">${mascot()}<div class="bubble">چه کتاب قشنگی نوشتی! می‌توانی صفحه را به معلم یا خانواده‌ات نشان بدهی 🌟</div></div>
      <button class="btn" onclick="level3()">مرحله‌ی چالش 🔥</button>`;
  }
  askName();
}

/* ---------- مرحله‌ی ۴: چالش ---------- */
function level3() {
  level = 3;
  const qs = shuffle(QUIZ).slice(0, 6);
  let i = 0, hearts = 3, correctCount = 0, timer = null, tleft = 0, locked = false;
  const LIMIT = 20;
  function show() {
    locked = false;
    const q = qs[i];
    const opts = shuffle([q.a, ...q.w]);
    app.innerHTML = header(3) + `<div class="center hearts">${"❤️".repeat(hearts)}${"🖤".repeat(3 - hearts)}</div>
      <div class="center" style="margin:4px 0">سؤال ${i + 1} از ${qs.length}</div>
      <div class="q">${q.q}</div><div class="timer"><div id="tbar"></div></div>
      <div class="opts">${opts.map(o => `<button class="opt" data-v="${o.replace(/"/g, "&quot;")}">${o}</button>`).join("")}</div><div id="msg"></div>`;
    document.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => pick(b)));
    tleft = LIMIT; clearInterval(timer);
    timer = setInterval(() => {
      tleft -= .1; const bar = $("#tbar"); if (!bar) { clearInterval(timer); return; }
      bar.style.width = Math.max(0, tleft / LIMIT * 100) + "%";
      bar.style.background = tleft < 6 ? "#ef5350" : "#66bb6a";
      if (tleft <= 0) { clearInterval(timer); pick(null); }
    }, 100);
  }
  function pick(btn) {
    if (locked) return; locked = true; clearInterval(timer);
    const q = qs[i]; const ok = btn && btn.dataset.v === q.a;
    document.querySelectorAll(".opt").forEach(b => { if (b.dataset.v === q.a) b.classList.add("good"); });
    if (ok) { correctCount++; score += 10; sndGood(); confetti(14); $("#msg").innerHTML = `<div class="center" style="margin-top:10px;font-weight:bold;color:#2e7d32">آفرین! +10 ⭐</div>`; }
    else { hearts--; sndBad(); if (btn) btn.classList.add("bad"); $("#msg").innerHTML = `<div class="center" style="margin-top:10px;font-weight:bold;color:#c62828">${btn ? "اشتباه شد" : "وقت تمام شد ⏰"}. جواب درست سبز شد.</div>`; }
    setTimeout(() => {
      if (hearts <= 0) return lose();
      i++; if (i >= qs.length) return end(); show();
    }, ok ? 1100 : 2200);
  }
  function lose() {
    app.innerHTML = header(3) + guide("قلب‌هایت تمام شد 😢 ولی ناراحت نشو! یک بار دیگر تلاش کن، حتماً می‌شود.", "sad") +
      `<button class="btn" onclick="level3()">دوباره تلاش می‌کنم 💪</button><button class="btn alt" onclick="end()">برو به پایان</button>`;
  }
  window.end = end;
  app.innerHTML = header(3) + guide("مرحله‌ی ۴: <b>چالش!</b> 🔥<br>برای هر سؤال ۲۰ ثانیه وقت داری و ۳ قلب داری. آماده‌ای؟") + `<button class="btn" id="go">شروع چالش</button>`;
  $("#go").onclick = show;
}
function end() {
  const stars = score >= 150 ? 3 : score >= 95 ? 2 : 1;
  sndWin(); confetti(70);
  app.innerHTML = header(4) + `<h1>🎉 تمام شد!</h1><div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
    <div class="score-big">${score} امتیاز</div>` +
    guide(stars === 3 ? "عالی بود! تو یک دانشمند آب هستی 🏆" : stars === 2 ? "خیلی خوب بود! یک بار دیگر بازی کن تا سه ستاره بگیری 😉" : "آفرین که تمامش کردی! دوباره بازی کن تا بیشتر یاد بگیری 💧") +
    `<button class="btn" onclick="home()">دوباره بازی کن 🔁</button>`;
}
home();
</script>
